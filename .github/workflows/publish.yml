name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

# Never cancel publication already in progress for a tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish-testpypi:
    needs: ci
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && (contains(github.ref_name, '-rc.') || contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/voice-forge-tts/
    permissions:
      # Read is required only to check out the exact candidate's verifier.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download only the qualified producer artifact in this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle

      - name: Verify source and distributions immediately before publishing
        env:
          EXPECTED_MANIFEST: ${{ needs.ci.outputs.manifest-sha256 }}
          EXPECTED_ARTIFACT_ID: ${{ needs.ci.outputs.artifact-id }}
          QUALIFICATION_RESULT: ${{ needs.ci.result }}
          DESTINATION: testpypi
        run: python scripts/release_artifacts.py publish-check --bundle "$RUNNER_TEMP/release-bundle" --expected-manifest "$EXPECTED_MANIFEST" --artifact-id "$EXPECTED_ARTIFACT_ID" --qualification "$QUALIFICATION_RESULT" --destination "$DESTINATION"

      - name: Publish to testpypi
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/release-bundle/dist/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: ci
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && (!contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-alpha.') && !contains(github.ref_name, '-beta.')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/voice-forge-tts/
    permissions:
      # Read is required only to check out the exact candidate's verifier.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download only the qualified producer artifact in this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle

      - name: Verify source and distributions immediately before publishing
        env:
          EXPECTED_MANIFEST: ${{ needs.ci.outputs.manifest-sha256 }}
          EXPECTED_ARTIFACT_ID: ${{ needs.ci.outputs.artifact-id }}
          QUALIFICATION_RESULT: ${{ needs.ci.result }}
          DESTINATION: pypi
        run: python scripts/release_artifacts.py publish-check --bundle "$RUNNER_TEMP/release-bundle" --expected-manifest "$EXPECTED_MANIFEST" --artifact-id "$EXPECTED_ARTIFACT_ID" --qualification "$QUALIFICATION_RESULT" --destination "$DESTINATION"

      - name: Publish to pypi
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/release-bundle/dist/
