name: Qualify distributions

on:
  workflow_call:
    outputs:
      artifact-id:
        description: Immutable artifact built in this run, admitted only after smoke succeeds
        value: ${{ jobs.build.outputs.artifact-id }}
      manifest-sha256:
        description: Manifest digest from the producer, passed outside the artifact
        value: ${{ jobs.build.outputs.manifest-sha256 }}

permissions:
  contents: read

env:
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.manifest.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify caller source identity
        run: python scripts/release_artifacts.py source

      # Separate cold build environment; the CI-only lock is not a release lock.
      - name: Install release build backend
        run: |
          python -m venv "$RUNNER_TEMP/release-build"
          "$RUNNER_TEMP/release-build/bin/python" -m pip --isolated install --no-cache-dir hatchling==1.33.0

      - name: Build wheel and sdist once
        run: |
          "$RUNNER_TEMP/release-build/bin/python" -m hatchling build -t sdist -t wheel -d "$RUNNER_TEMP/release-bundle/dist"

      - name: Bind distributions to the producer source
        id: manifest
        run: python scripts/release_artifacts.py create --bundle "$RUNNER_TEMP/release-bundle"

      - name: Upload immutable distributions
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          if-no-files-found: error
          overwrite: false

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download only this producer's artifact in this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle

      - name: Verify and smoke-install the exact wheel outside checkout
        env:
          EXPECTED_MANIFEST: ${{ needs.build.outputs.manifest-sha256 }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: python scripts/release_artifacts.py smoke --bundle "$RUNNER_TEMP/release-bundle" --expected-manifest "$EXPECTED_MANIFEST" --artifact-id "$EXPECTED_ARTIFACT_ID"
