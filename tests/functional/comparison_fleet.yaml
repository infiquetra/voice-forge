# Cross-backend comparison fleet: 3 sister-text rows × 3 backends each.
#
# Each ID matches a key in responses.yaml so all three backend rows read the
# SAME text as their counterparts — apples-to-apples comparison on identical
# words.
#
# voice_id values distinguish the backend:
#   *-comms / *-research / *-books → NeuTTS clones (home-lab refs, autoregressive llama-cpp)
#   kokoro-*                       → Kokoro preset voices (no cloning, encoder-decoder)
#   *-f5                           → F5-TTS clones (same home-lab refs, diffusion)

- id: saga
  display_name: "Saga · NeuTTS clone"
  voice_id: saga-comms
  backend: neutts
  target_agent: Loki

- id: saga
  display_name: "Saga's text · Kokoro af_bella"
  voice_id: kokoro-bella
  backend: kokoro
  target_agent: Loki

- id: saga
  display_name: "Saga · F5 clone (same ref)"
  voice_id: saga-comms-f5
  backend: f5
  target_agent: Loki

- id: heid
  display_name: "Heid · NeuTTS clone"
  voice_id: heid-research
  backend: neutts
  target_agent: Bragi

- id: heid
  display_name: "Heid's text · Kokoro af_nicole"
  voice_id: kokoro-nicole
