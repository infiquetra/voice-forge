[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "voice-forge"
version = "0.1.0-pre"
description = "Pluggable TTS service for agent voices — synthesis, cloning, voice lab, registry"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Jeffrey Cox", email = "jeff@infiquetra.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
neutts = [
    # NeuTTS-Air backend (CPU/Metal-friendly, instant cloning)
    "neutts[llama]>=1.2",
]
voice-lab = [
    # ElevenLabs Voice Lab puller + Whisper ref-trimmer
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
]

[project.scripts]
voice-forge = "voice_forge.cli:main"

[project.urls]
Homepage = "https://github.com/infiquetra/voice-forge"
Issues = "https://github.com/infiquetra/voice-forge/issues"
Documentation = "https://github.com/infiquetra/voice-forge/tree/main/docs"
"Engineering Journal" = "https://github.com/infiquetra/voice-forge/tree/main/docs/engineering-journal"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
