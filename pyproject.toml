[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "voice-forge-tts"
version = "0.2.0"
description = "Pluggable TTS service for agent voices — synthesis, cloning, voice lab, registry"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Jeffrey Cox", email = "jeff@infiquetra.com" },
]
# Note: import name is `voice_forge` (PEP 8); the PyPI distribution name is
# `voice-forge-tts` because the bare `voice-forge` name on PyPI was already
# taken by an unrelated project before v0.1.0 published.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "click>=8.1",
    "python-multipart>=0.0.9",  # FastAPI File/Form deps
]

[project.optional-dependencies]
neutts = [
    # NeuTTS-Air backend (CPU/Metal-friendly, instant cloning)
    "neutts[llama]>=1.2",
]
kokoro = [
    # Kokoro-82M backend (PyTorch + MPS-capable; preset voices)
    # NOTE: requires `espeak-ng` on the host PATH (brew install espeak-ng).
    "kokoro>=0.9.4,<1.0",
]
f5 = [
    # F5-TTS backend (PyTorch + MPS-capable diffusion; voice cloning).
    # Wrapper is MIT-licensed; model weights from SWivid/F5-TTS are Apache-2.
    "f5-tts>=1.1,<2.0",
]
voice-lab = [
    # ElevenLabs Voice Lab puller + Whisper ref-trimmer
    "faster-whisper>=1.0",
]
all = [
    "voice-forge-tts[neutts,kokoro,f5,voice-lab]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
]

[project.scripts]
voice-forge = "voice_forge.cli:main"

[tool.hatch.build.targets.wheel]
# Dist name is voice-forge-tts but the import package is voice_forge.
# Hatchling can't auto-derive that mapping from the renamed dist; declare it.
packages = ["src/voice_forge"]

[tool.hatch.build.targets.sdist]
include = [
    "src/voice_forge",
    "tests",
    "docs",
    "docker",
    "scripts",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[project.urls]
Homepage = "https://github.com/infiquetra/voice-forge"
Issues = "https://github.com/infiquetra/voice-forge/issues"
Documentation = "https://github.com/infiquetra/voice-forge/tree/main/docs"
"Engineering Journal" = "https://github.com/infiquetra/voice-forge/tree/main/docs/engineering-journal"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Form/File/Depends() in arg defaults is idiomatic, not a B008 violation.
"src/voice_forge/server.py" = ["B008"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party packages without py.typed markers / shipped stubs. We don't
# control them; suppress import-not-found / missing-stub noise.
module = [
    "neutts",
    "llama_cpp",
    "faster_whisper",
    "kokoro",
    "f5_tts",
    "f5_tts.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
