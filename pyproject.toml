[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "voice-forge-tts"
version = "0.2.0"
description = "Pluggable TTS service for agent voices — synthesis, cloning, voice lab, registry"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Jeffrey Cox", email = "jeff@infiquetra.com" },
]
# Note: import name is `voice_forge` (PEP 8); the PyPI distribution name is
# `voice-forge-tts` because the bare `voice-forge` name on PyPI was already
# taken by an unrelated project before v0.1.0 published.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "click>=8.1",
    "python-multipart>=0.0.9",  # FastAPI File/Form deps
    "prometheus-client>=0.20",  # /metrics endpoint
]

[project.optional-dependencies]
neutts = [
    # NeuTTS-Air backend (CPU/Metal-friendly, instant cloning)
    "neutts[llama]>=1.2",
]
kokoro = [
    # Kokoro-82M backend (PyTorch + MPS-capable; preset voices)
    # NOTE: requires `espeak-ng` on the host PATH (brew install espeak-ng).
    "kokoro>=0.9.4,<1.0",
]
f5 = [
    # F5-TTS backend (PyTorch + MPS-capable diffusion; voice cloning).
    # Wrapper is MIT-licensed; model weights from SWivid/F5-TTS are Apache-2.
    "f5-tts>=1.1,<2.0",
    # torch + torchaudio + torchcodec ABI lockstep:
    # torchaudio 2.9 hard-removes the soundfile-backed `load()` and routes
    # everything through torchcodec. torchcodec 0.8+ for torch 2.9.x is
    # currently shipping with a libtorch_cpu symbol mismatch on macOS
    # (`_aoti_torch_aten_subtract_Tensor` not found). torch 2.8.0 +
    # torchaudio 2.8.0 + torchcodec 0.7.0 is the last verified-working
    # trio on this host — pin it explicitly until upstream resolves the ABI.
    "torch>=2.8,<2.9",
    "torchaudio>=2.8,<2.9",
    "torchcodec>=0.7,<0.8",
]
xtts = [
    # XTTS-v2 backend via Coqui idiap fork (MPL-2.0; multilingual + cloning).
    # transformers<5 pin: coqui-tts 0.27.5 imports
    # `transformers.pytorch_utils.isin_mps_friendly` which was removed in v5.
    # Lift the pin when upstream coqui-tts catches up to transformers 5.x.
    "coqui-tts>=0.27,<0.30",
    "transformers<5",
]
dia = [
    # Dia-1.6B backend (Apache-2, nari-labs/Dia-1.6B-0626; multi-speaker + cloning).
    # No standalone PyPI package — accessed via HF Transformers's native
    # DiaForConditionalGeneration class (added in transformers 4.46+).
    # `librosa` for 44.1 → 24 kHz resampling.
    "transformers>=4.46,<5",
    "librosa>=0.10",
]
voice-lab = [
    # ElevenLabs Voice Lab puller + Whisper ref-trimmer
    "faster-whisper>=1.0",
]
all = [
    "voice-forge-tts[neutts,kokoro,f5,xtts,dia,voice-lab]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
    "bandit>=1.7",
    "pre-commit>=3.7",
]

[project.scripts]
voice-forge = "voice_forge.cli:main"

[tool.hatch.build.targets.wheel]
# Dist name is voice-forge-tts but the import package is voice_forge.
# Hatchling can't auto-derive that mapping from the renamed dist; declare it.
packages = ["src/voice_forge"]

[tool.hatch.build.targets.sdist]
include = [
    "src/voice_forge",
    "tests",
    "docs",
    "docker",
    "scripts",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[project.urls]
Homepage = "https://github.com/infiquetra/voice-forge"
Issues = "https://github.com/infiquetra/voice-forge/issues"
Documentation = "https://github.com/infiquetra/voice-forge/tree/main/docs"
"Engineering Journal" = "https://github.com/infiquetra/voice-forge/tree/main/docs/engineering-journal"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Form/File/Depends() in arg defaults is idiomatic, not a B008 violation.
"src/voice_forge/server.py" = ["B008"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party packages without py.typed markers / shipped stubs. We don't
# control them; suppress import-not-found / missing-stub noise.
module = [
    "neutts",
    "llama_cpp",
    "faster_whisper",
    "kokoro",
    "f5_tts",
    "f5_tts.*",
    "TTS",
    "TTS.*",
    "soundfile",
    "librosa",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.bandit]
# Files / paths bandit shouldn't scan. Tests + scripts intentionally use
# patterns (assert, subprocess, tempfile) that would noise up the report
# without finding real production issues.
exclude_dirs = ["tests", "scripts", ".venv", ".audition-registry", "docs", "_porting"]

# Skips:
#   B101 - assert_used: pytest uses assert; tests are excluded but stubs
#          inside src/voice_forge/backends/_subprocess.py and similar may
#          legitimately use assert as type-narrow guards
#   B404 - import_subprocess: we use subprocess intentionally (FFmpeg shell-out,
#          voice-forge serve auto-launch in tests, future subprocess pattern
#          for hostile-dep backends). Track real subprocess.run() risks via
#          B603 / B607 instead.
skips = ["B101", "B404"]
